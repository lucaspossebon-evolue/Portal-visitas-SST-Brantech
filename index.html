<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="color-scheme" content="light">
<title>Brantech · Portal de Visitas SST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ color-scheme:light;
    
    --brand:#0B3B34; --brand-2:#0F4A41; --brand-ink:#072823; --bright:#15803D;
    --deep:#0B3B34; --deep-2:#0F4A41;
    --ink:#12211E; --text:#12211E; --paper:#EEF2F1; --card:#FFFFFF; --surface-2:#F6F8F7;
    --soft:#E6F4EB; --muted:#5C6B67; --faint:#8A9793;
    --line:#DCE4E2; --line-2:#E9EEEC;
    --ok:#15803D; --ok-bg:#E6F4EB; --ok-line:#BFE3CB;
    --no:#C62828; --no-bg:#FBEAEA; --no-line:#F0C4C4;
    --na:#546A78; --na-bg:#ECF0F2; --na-line:#D3DDE1;
    --amber:#B45309; --amber-soft:#FBF0E2;
    --red:#C62828; --red-soft:#FBEAEA;
    --blue:#3A5A8C; --blue-soft:#E7EEFA;
    --shadow:0 1px 2px rgba(7,40,35,.06),0 6px 20px rgba(7,40,35,.06);
    --shadow-lg:0 8px 40px rgba(7,40,35,.14);
    --r:14px; --r-sm:10px;
    --mono:'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;
    --disp:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  h1.title,.vhead .vh1,.kpi .n,.stamp .ts,.seal,.idxchip .val{font-family:var(--disp)}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--paper);color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:44px}
  .app{max-width:560px;margin:0 auto;min-height:100vh}
  .bar{position:sticky;top:0;z-index:30;background:var(--deep);display:flex;align-items:center;gap:10px;
    padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08)}
  .bar .chip{background:#fff;border-radius:7px;padding:5px 8px;display:flex;align-items:center}
  .bar .chip img{height:22px;display:block}
  .bar .tag{color:#fff;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700;
    opacity:.85;border-left:1px solid rgba(255,255,255,.25);padding-left:10px}
  .bar .who{margin-left:auto;font-size:12.5px;color:#BFD6C8;display:flex;align-items:center;gap:8px}
  .bar .who .dot{width:27px;height:27px;border-radius:50%;background:var(--bright);color:var(--deep);
    display:grid;place-items:center;font-weight:800;font-size:12px}
  .bar button.link{background:none;border:none;color:#8FB3A0;font-size:12px;cursor:pointer;text-decoration:underline;padding:0}
  .back{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 2px 0 0;line-height:1}
  .wrap{padding:16px}
  .eyebrow{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--brand);font-weight:800;margin:0 0 5px}
  h1.title{font-size:22px;margin:0 0 3px;font-weight:800;letter-spacing:-.4px;line-height:1.18}
  h1.title em{font-style:normal;color:var(--brand)}
  .sub{color:var(--muted);font-size:13px;margin:0 0 15px}
  .sub b{color:var(--ink)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;margin-bottom:11px}
  .card.tap{cursor:pointer;transition:transform .06s,border-color .15s,box-shadow .15s}
  .card.tap:active{transform:scale(.99)}
  .card.tap:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(0,152,76,.08)}
  .row{display:flex;align-items:center;gap:12px}
  .grow{flex:1;min-width:0}
  .name{font-weight:700;font-size:15px;line-height:1.25}
  .meta{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:5px 9px;align-items:center}
  .meta b{color:var(--ink);font-weight:700}
  .pill{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:3px 8px;
    border-radius:5px;white-space:nowrap;letter-spacing:.3px}
  .pill.seg{background:var(--soft);color:var(--deep)}
  .pill.time{background:var(--ink);color:#fff}
  .pill.done{background:var(--brand);color:#fff}
  .pill.open{background:var(--amber-soft);color:#8a5600}
  .pill.prog{background:var(--blue-soft);color:var(--blue)}
  .pill.late{background:var(--red-soft);color:var(--red)}
  .pill.ghost{background:#EEF1EF;color:var(--muted)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:none;border-radius:11px;
    padding:15px 16px;font-size:15.5px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.2px}
  .btn.green{background:var(--brand);color:#fff} .btn.green:active{background:var(--deep-2)}
  .btn.amber{background:var(--amber);color:#fff}
  .btn.dark{background:var(--ink);color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn[disabled]{opacity:.45;cursor:not-allowed}
  .btn.sm{padding:11px 14px;font-size:14px}
  .stack{display:flex;flex-direction:column;gap:9px}
  .search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font-size:15px;
    font-family:inherit;background:#fff;margin-bottom:10px}
  .search:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
  .techgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .techcard{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 12px;text-align:center;cursor:pointer}
  .techcard:hover{border-color:var(--brand)}
  .techcard .av{width:52px;height:52px;border-radius:50%;margin:0 auto 9px;background:var(--deep);color:var(--bright);
    display:grid;place-items:center;font-weight:800;font-size:19px}
  .techcard .tn{font-weight:800}
  .techcard .tc{font-size:12px;color:var(--muted);margin-top:2px}
  .stamp{border:1px dashed var(--line);border-radius:11px;padding:12px 14px;background:#FAFCFB}
  .stamp .lbl{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:800}
  .stamp .ts{font-family:var(--mono);font-size:18px;font-weight:600;margin-top:2px}
  .stamp .geo{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:3px;word-break:break-all;display:block}
  .stamp.in{border-color:var(--amber);background:var(--amber-soft)}
  .stamp.out{border-color:var(--brand);background:var(--soft)}
  .stamp a{color:var(--brand);font-family:var(--sans);font-size:12px;font-weight:700}
  .ck{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:9px}
  .ck.nc{border-color:var(--red);border-left-width:4px}
  .ck.ok{border-left:4px solid var(--brand)}
  .ck .q{font-weight:700;font-size:14.5px}
  .ck .v{font-size:12.5px;color:var(--muted);margin-top:2px}
  .ck .nr{font-size:10.5px;color:var(--brand);font-weight:800;margin-top:4px;letter-spacing:.4px}
  .opts{display:flex;gap:6px;margin-top:10px}
  .opt{flex:1;text-align:center;border:1.5px solid var(--line);border-radius:9px;padding:9px 3px;font-size:12.5px;
    font-weight:800;cursor:pointer;background:#fff;color:var(--muted)}
  .opt.c.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .opt.n.on{background:var(--no-bg);border-color:var(--no);color:var(--no)}
  .opt.a.on{background:var(--na-bg);border-color:var(--na);color:var(--na)}
  .ck textarea{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:9px;padding:8px;
    font-family:inherit;font-size:13px;resize:vertical;height:38px;display:none}
  .ck.show-note textarea{display:block}
  .photobar{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
  .addphoto{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--line);background:#fff;
    border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
  .addphoto:hover{border-color:var(--brand);color:var(--brand)}
  .addphoto input{display:none}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap}
  .thumb{position:relative;width:52px;height:52px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
  .thumb .x{position:absolute;top:1px;right:1px;background:rgba(10,15,12,.78);color:#fff;border:none;
    border-radius:50%;width:17px;height:17px;font-size:11px;line-height:1;cursor:pointer;padding:0}
  .phcount{font-size:11px;color:var(--brand);font-weight:800}
  .lb{position:fixed;inset:0;background:rgba(6,48,26,.94);z-index:60;display:grid;place-items:center;padding:20px}
  .lb img{max-width:100%;max-height:82vh;border-radius:10px}
  .lb button{position:absolute;top:16px;right:16px;background:#fff;border:none;border-radius:50%;width:38px;height:38px;font-size:19px;cursor:pointer;font-weight:700}
  .sheet-bg{position:fixed;inset:0;background:rgba(6,48,26,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 16px 22px;max-height:92vh;overflow-y:auto}
  .sheet h3{margin:0 0 3px;font-size:18px;font-weight:800;letter-spacing:-.3px}
  .sheet h3 em{font-style:normal;color:var(--brand)}
  .sheet .hint{font-size:12.5px;color:var(--muted);margin:0 0 14px}
  .fld{margin-bottom:11px}
  .fld label{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:4px}
  .fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;
    font-size:15px;font-family:inherit;background:#fff}
  .fld textarea{height:66px;resize:vertical}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
  .fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .sigbox{border:1.5px dashed var(--line);border-radius:11px;background:#FBFDFC;position:relative;overflow:hidden}
  .sigbox canvas{display:block;width:100%;height:150px;touch-action:none;cursor:crosshair}
  .sigbox .ghost{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;color:#A9BBB1;font-size:13px;font-weight:600}
  .sigbox.signed .ghost{display:none}
  .sigline{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
  .sigline span{font-size:11.5px;color:var(--muted)}
  .sigline button{background:none;border:none;color:var(--red);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;padding:0}
  .absent{display:flex;align-items:center;gap:9px;margin:12px 0;font-size:13.5px;cursor:pointer}
  .absent input{width:18px;height:18px;accent-color:var(--brand)}
  .sectlabel{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink);
    margin:17px 0 8px;display:flex;align-items:center;gap:9px}
  .sectlabel .ln{flex:1;height:1px;background:var(--line)}
  .sectlabel.focus{color:var(--amber)}
  .prog{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:14px}
  .prog i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
  .note{font-size:12.5px;padding:10px 12px;border-radius:9px;margin-bottom:12px}
  .note.info{background:var(--soft);color:var(--deep)}
  .note.warn{background:var(--amber-soft);color:#7a4e00}
  .mini{font-size:11.5px;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:30px 16px;font-size:14px}
  /* tabs do hub */
  .hubtabs{display:flex;gap:6px;margin:0 0 14px;overflow-x:auto;padding-bottom:2px}
  .hubtab{flex:0 0 auto;padding:8px 13px;border-radius:9px;font-size:13px;font-weight:800;background:#fff;
    border:1px solid var(--line);color:var(--muted);cursor:pointer;white-space:nowrap}
  .hubtab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .hubtab .b{display:inline-block;background:var(--red);color:#fff;border-radius:9px;padding:0 5px;font-size:10px;margin-left:4px}
  /* KPIs */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:11px 9px;text-align:center}
  .kpi .n{font-size:21px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
  .kpi .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-top:2px}
  .kpi.g .n{color:var(--brand)} .kpi.r .n{color:var(--red)} .kpi.a .n{color:var(--amber)} .kpi.b .n{color:var(--blue)}
  /* filtros */
  .filters{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:12px}
  .frow{margin-bottom:9px}
  .frow:last-child{margin-bottom:0}
  .flab{font-size:10px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;color:var(--muted);margin-bottom:5px}
  .chips{display:flex;gap:5px;flex-wrap:wrap}
  .chip2{padding:5px 10px;border-radius:7px;font-size:12px;font-weight:700;background:#F3F6F3;border:1px solid var(--line);
    color:var(--muted);cursor:pointer;white-space:nowrap}
  .chip2.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .chip2.on.r{background:var(--red);border-color:var(--red)}
  .chip2.on.a{background:var(--amber);border-color:var(--amber)}
  /* ficha */
  .kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted);flex-shrink:0}
  .kv .val{font-weight:700;text-align:right;word-break:break-word}
  .kv .val.mono{font-family:var(--mono)}
  .kv .val.na{color:#A9BBB1;font-weight:600;font-style:italic}
  .doclist .d{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #F1F4F2}
  .doclist .d:last-child{border-bottom:none}
  .doclist .dn{font-weight:700;font-size:13.5px;flex:1}
  .doclist .dd{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .badge{font-size:10px;font-weight:800;padding:3px 7px;border-radius:5px;white-space:nowrap;letter-spacing:.3px}
  .badge.ok{background:var(--soft);color:var(--deep)}
  .badge.alerta{background:var(--amber-soft);color:#8a5600}
  .badge.venc{background:var(--red-soft);color:var(--red)}
  .badge.na{background:#EEF1EF;color:var(--muted)}
  /* agenda */
  .tl{position:relative;padding-left:19px}
  .tl:before{content:'';position:absolute;left:5px;top:5px;bottom:5px;width:2px;background:var(--line)}
  .tl .ev{position:relative;padding:0 0 13px}
  .tl .ev:before{content:'';position:absolute;left:-18px;top:5px;width:10px;height:10px;border-radius:50%;
    background:#fff;border:2px solid var(--line)}
  .tl .ev.done:before{background:var(--brand);border-color:var(--brand)}
  .tl .ev.late:before{background:var(--red);border-color:var(--red)}
  .tl .ev.next:before{background:var(--amber);border-color:var(--amber)}
  .tl .ed{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .tl .et{font-weight:700;font-size:13.5px}
  /* materiais */
  .mat{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #F1F4F2}
  .mat:last-child{border-bottom:none}
  .mat .ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex-shrink:0}
  .ic.DDS{background:var(--blue-soft)} .ic.Cartilha{background:var(--soft)}
  .ic.Cartaz{background:var(--amber-soft)} .ic.Comprovante{background:#EFEAF7}
  .ic.Relatório{background:#F1F4F2} .ic.Outro{background:#F1F4F2}
  .mat .mn{font-weight:700;font-size:13.5px;line-height:1.25}
  .mat .mm{font-size:11.5px;color:var(--muted);margin-top:1px}
  .doc{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}
  .doc .head{background:var(--deep);padding:16px;border-bottom:3px solid var(--bright)}
  .doc .head .lg{background:#fff;border-radius:7px;padding:6px 9px;display:inline-flex;margin-bottom:9px}
  .doc .head .lg img{height:26px;display:block}
  .doc .head .t{font-weight:800;font-size:15.5px;color:#fff;letter-spacing:-.2px}
  .doc .head .s{font-size:11.5px;color:#9EC4AF;margin-top:2px}
  .doc .body{padding:16px}
  .seal{margin-top:14px;border:2px solid var(--brand);color:var(--brand);border-radius:9px;padding:11px;
    text-align:center;font-weight:800;letter-spacing:1.2px;font-size:12.5px}
  .seal.part{border-color:var(--amber);color:#8a5600}
  .clrow{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #F1F4F2;font-size:13px}
  .st{font-weight:800;font-size:10px;padding:2px 6px;border-radius:4px;height:fit-content;white-space:nowrap;letter-spacing:.4px}
  .st.C{background:var(--soft);color:var(--deep)} .st.N{background:var(--red-soft);color:var(--red)}
  .st.A{background:#EEF1EF;color:var(--muted)} .st.P{background:var(--amber-soft);color:#8a5600}
  .docphotos{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
  .docphotos img{width:74px;height:74px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
  .sigproof{border:1px solid var(--line);border-radius:11px;padding:12px;margin-top:10px;text-align:center}
  .sigproof img{max-width:230px;max-height:82px;display:block;margin:0 auto 6px}
  .sigproof .rule{border-top:1px solid var(--ink);width:230px;margin:0 auto 5px}
  .sigproof .nm{font-weight:800;font-size:13.5px}
  .sigproof .rl{font-size:11.5px;color:var(--muted)}
  .sigproof.absent{background:var(--amber-soft);border-color:var(--amber);color:#8a5600;font-size:12.5px;font-weight:700}
  .foot{font-size:10.5px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.6}

  /* ---- biblioteca ---- */
  .lib{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #F1F4F2;cursor:pointer}
  .lib:last-child{border-bottom:none}
  .lib:active{opacity:.6}
  .lib .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex-shrink:0}
  .lib .ln{font-weight:700;font-size:13.5px;line-height:1.25}
  .lib .lm{font-size:11.5px;color:var(--muted);margin-top:2px}
  .lib .go{font-size:18px;color:var(--muted)}
  .tagpdf{font-size:9.5px;font-weight:800;background:var(--red-soft);color:var(--red);padding:2px 5px;border-radius:4px}
  .tagseg{font-size:9.5px;font-weight:800;background:var(--soft);color:var(--deep);padding:2px 5px;border-radius:4px}
  /* ---- roteiro (modo apresentação) ---- */
  .rt{position:fixed;inset:0;background:#fff;z-index:70;display:flex;flex-direction:column}
  .rt .rh{background:var(--deep);padding:11px 14px;border-bottom:3px solid var(--bright);flex-shrink:0}
  .rt .rh .rt1{color:var(--bright);font-size:9.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase}
  .rt .rh .rt2{color:#fff;font-size:15px;font-weight:800;margin-top:1px}
  .rt .rh .rx{position:absolute;top:10px;right:12px;background:rgba(255,255,255,.15);border:none;color:#fff;
    width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;font-weight:700}
  .rt .rp{height:4px;background:var(--line);flex-shrink:0}
  .rt .rp i{display:block;height:100%;background:var(--bright);transition:width .2s}
  .rt .rb{flex:1;overflow-y:auto;padding:18px 16px 12px}
  .rt .step{font-size:10.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--brand)}
  .rt h2{font-size:21px;font-weight:800;letter-spacing:-.4px;margin:3px 0 2px;line-height:1.2}
  .rt .h2s{font-size:13px;color:var(--muted);margin-bottom:14px}
  .rt .say{font-size:16.5px;line-height:1.6;margin-bottom:12px}
  .rt .cardx{border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:10px;padding:12px;margin-bottom:9px}
  .rt .cardx .ch{font-weight:800;color:var(--brand);font-size:12px;letter-spacing:1px;margin-bottom:3px}
  .rt .cardx .cx{font-size:15px;line-height:1.5}
  .rt .fx{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:9px;padding:11px;margin-bottom:8px}
  .rt .fx.f2{border-left-color:var(--amber);background:var(--amber-soft)}
  .rt .fx.f3{border-left-color:var(--red);background:var(--red-soft)}
  .rt .fx .fh{font-weight:800;font-size:14.5px;margin-bottom:4px}
  .rt .fx .fl{font-size:13.5px;margin-bottom:2px}
  .rt .tbx{width:100%;border-collapse:collapse;font-size:13px}
  .rt .tbx th{background:var(--deep);color:#fff;font-size:10px;text-transform:uppercase;letter-spacing:.5px;
    padding:7px;text-align:left}

  .rt .tbx td:first-child{font-weight:700;color:var(--deep)}
  .rt .rgx{display:flex;gap:10px;margin-bottom:10px}
  .rt .rgx .rn{width:26px;height:26px;border-radius:7px;background:var(--soft);color:var(--deep);
    display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
  .rt .rgx .rh2{font-weight:800;font-size:14.5px;margin-bottom:2px}
  .rt .rgx .rx2{font-size:13.5px;color:var(--ink);line-height:1.5}
  .rt .erx{display:flex;gap:10px;margin-bottom:10px}
  .rt .erx .en{width:26px;height:26px;border-radius:7px;background:var(--red-soft);color:var(--red);
    border:1px solid var(--red);display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
  .rt .erx .eh{font-weight:800;font-size:14.5px}
  .rt .erx .ex{font-size:13px;color:var(--muted)}
  .rt .reflx{border:2px dashed var(--brand);background:#F7FAF8;border-radius:11px;padding:14px;
    font-style:italic;font-size:16px;color:var(--deep);text-align:center;margin-bottom:12px;line-height:1.55}
  .rt .pergx{font-size:15.5px;padding-left:18px;line-height:1.7}
  .rt .hidx{display:flex;gap:7px;margin-bottom:10px}
  .rt .hidx .hb{flex:1;background:var(--deep);color:#fff;border-radius:9px;padding:10px 6px;text-align:center}
  .rt .hidx .hk{font-size:9.5px;color:var(--bright);font-weight:800;letter-spacing:.5px}
  .rt .hidx .hv{font-size:17px;font-weight:800;margin:2px 0}
  .rt .hidx .hu{font-size:10px;color:#A8CBB7}
  .rt .emx{display:flex;gap:7px;margin-bottom:10px}
  .rt .emx .eb{flex:1;border:1.5px solid var(--red);background:var(--red-soft);border-radius:9px;
    padding:10px 4px;text-align:center}
  .rt .emx .ek{font-size:10px;font-weight:800;color:var(--red)}
  .rt .emx .ev{font-size:18px;font-weight:800;color:var(--red)}
  .rt .rf{flex-shrink:0;padding:10px 14px 14px;border-top:1px solid var(--line);background:#fff;display:flex;gap:8px}
  .rt .rf button{flex:1;border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:800;
    font-family:inherit;cursor:pointer}
  .rt .rf .prev{background:#fff;border:1.5px solid var(--line);color:var(--ink);flex:0 0 92px}
  .rt .rf .next{background:var(--brand);color:#fff}
  .rt .rf .fim{background:var(--ink);color:#fff}

  /* ---- base app de auditoria: abas no rodapé ---- */
  .wrap.wvisit{padding-bottom:80px}
  .vhead{padding:12px 16px 8px}
  .vhead .vh1{font-size:19px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
  .vhead .vh2{font-size:12px;color:var(--muted);margin-top:2px}
  .vbody{padding:0 16px}
  .bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;background:#fff;
    border-top:1px solid var(--line);display:flex;z-index:25;box-shadow:0 -2px 12px rgba(6,48,26,.07)}
  .bni{flex:1;border:none;background:none;padding:9px 3px 9px;font-family:inherit;cursor:pointer;display:flex;
    flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:700}
  .bni .bi{font-size:18px;line-height:1}
  .bni .bg{position:absolute;margin-left:26px;margin-top:-3px;background:var(--red);color:#fff;font-size:9px;
    font-weight:800;border-radius:9px;padding:0 4px;min-width:14px;text-align:center}
  .bni{color:var(--faint)}
  .bni.on{color:var(--brand)} .bni.on .bl{font-weight:700}
  .bni.on::before{content:'';position:absolute;top:0;width:26px;height:3px;border-radius:0 0 3px 3px;background:var(--brand)}
  /* dashboard índice */
  .idx{background:var(--deep);border-radius:13px;padding:16px;color:#fff;text-align:center;margin-bottom:14px}
  .idx .idxbig{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1}
  .idx .idxl{font-size:10.5px;color:#A8CBB7;text-transform:uppercase;letter-spacing:1px;font-weight:700;margin-top:2px}
  .idx .idxrow{display:flex;justify-content:center;gap:12px;font-size:11.5px;color:#CDE3D6;margin-top:9px;flex-wrap:wrap}
  .idx .prog{margin-top:11px;background:rgba(255,255,255,.2)}
  .idx .prog i{background:var(--bright)}
  .idx .idxsub{font-size:11px;color:#A8CBB7;margin-top:7px}
  /* plano de ação */
  .pl{background:#fff;border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:11px;
    padding:11px 12px;margin-bottom:9px}
  .pl.hi{border-left-color:var(--red)} .pl.me{border-left-color:var(--amber)} .pl.lo{border-left-color:var(--muted)}
  .pl .plh{display:flex;align-items:center;gap:8px}
  .pl .plp{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;letter-spacing:.4px;white-space:nowrap}
  .pl .plp.r{background:var(--red-soft);color:var(--red)} .pl .plp.a{background:var(--amber-soft);color:#8a5600}
  .pl .plp.b{background:#EEF1EF;color:var(--muted)}
  .pl .pln{font-weight:700;font-size:13.5px;flex:1}
  .pl .plnr{font-size:10.5px;color:var(--brand);font-weight:800}
  .pl .pla{font-size:12.5px;margin-top:6px}
  .pl .plo{font-size:11.5px;color:var(--muted);margin-top:3px}
  /* painel identificação */
  .qgrid{display:flex;gap:8px;margin-bottom:12px}
  .qbtn{flex:1;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 6px;font-family:inherit;
    font-weight:700;font-size:12.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink)}
  .qbtn:active{transform:scale(.98)} .qbtn:hover{border-color:var(--brand)} .qbtn .qi{font-size:18px}
  .panelhdr{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
  .panelhdr .pback{background:none;border:none;color:var(--brand);font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;padding:0}
  .panelhdr .pttl{font-size:16px;font-weight:800}

  /* ---- medidor circular (índice) estilo auditoria ---- */
  .gaugecard{display:flex;gap:15px;align-items:center;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:15px;margin-bottom:14px;box-shadow:var(--shadow)}
  .gauge{position:relative;width:120px;height:120px;flex:0 0 120px}
  .gauge svg{transform:rotate(-90deg)}
  .gauge .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .gauge .center .big{font-family:var(--disp);font-size:31px;font-weight:700;line-height:1}
  .gauge .center .big .u{font-size:15px;font-weight:600}
  .gauge .center .cap{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-top:4px}
  .gmeta{flex:1;min-width:0}
  .gmeta p{margin:0 0 4px;font-size:12.5px;color:var(--muted)}
  .gmeta p b{color:var(--text);font-family:var(--disp);font-weight:600}
  .gmeta .prog{margin:8px 0 4px;background:var(--line-2)}
  .gmeta .gsub{font-size:11px;color:var(--faint);margin:0}

  /* ---- login ---- */
  .login{min-height:calc(100vh - 52px);display:flex;flex-direction:column;justify-content:center;padding:24px 20px 40px;max-width:400px;margin:0 auto}
  .login .lgmark{width:74px;height:74px;border-radius:19px;background:var(--deep);display:grid;place-items:center;margin:0 auto 18px;box-shadow:var(--shadow)}
  .login .lgmark img{width:52px;display:block}
  .login h1{font-family:var(--disp);font-size:23px;font-weight:700;text-align:center;margin:0 0 4px;letter-spacing:-.3px}
  .login .lsub{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 24px}
  .login .fld{margin-bottom:13px}
  .login label{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px}
  .login input,.login select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:15.5px;font-family:inherit;background:var(--card);color:var(--ink)}
  .login input:focus,.login select:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
  .login .pwrow{position:relative}
  .login .pwrow .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--faint);cursor:pointer;font-size:16px;padding:4px}
  .login .err{background:var(--no-bg);color:var(--no);border-radius:var(--r-sm);padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:12px;text-align:center}
  .login .info{background:var(--soft);color:var(--brand-ink);border-radius:var(--r-sm);padding:10px 12px;font-size:12px;margin-bottom:13px;line-height:1.5}
  .login .lbtn{margin-top:4px}
  .login .lnote{text-align:center;font-size:11px;color:var(--faint);margin-top:18px;line-height:1.5}

  /* ---- dashboard / lista de clientes ---- */
  .dashkpi{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:2px 0 14px}
  .dashkpi .dk{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 8px;text-align:center;box-shadow:var(--shadow)}
  .dashkpi .dk .n{display:block;font-family:var(--disp);font-size:22px;font-weight:700;line-height:1;color:var(--brand)}
  .dashkpi .dk .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-top:3px;display:block}
  .dashkpi .dk.ok .n{color:var(--ok)} .dashkpi .dk.no .n{color:var(--no)}
  .linkrow{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);
    padding:12px 14px;font-family:inherit;font-size:14px;font-weight:600;color:var(--brand);cursor:pointer;margin-bottom:13px;box-shadow:var(--shadow)}
  .linkrow:active{transform:scale(.995)}
  .fchips{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
  .fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;
    padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .fchip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .listcount{font-size:11px;color:var(--faint);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin:2px 2px 9px}
  .crow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--r);padding:12px 13px;margin-bottom:9px;cursor:pointer;box-shadow:var(--shadow);
    border-left:3px solid var(--line);transition:border-color .15s,box-shadow .15s}
  .crow:active{transform:scale(.996)}
  .crow:hover{box-shadow:var(--shadow-lg)}
  .crow-late{border-left-color:var(--no)} .crow-open{border-left-color:var(--pend)}
  .crow-done{border-left-color:var(--ok)} .crow-prog{border-left-color:var(--brand)}
  .crow .cav{width:40px;height:40px;border-radius:11px;background:var(--soft);color:var(--brand);
    display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:14px;flex-shrink:0}
  .crow .cmain{flex:1;min-width:0}
  .crow .cname{font-weight:600;font-size:14.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow .csub{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow .cflag{font-size:11px;color:var(--no);font-weight:600;margin-top:3px}
  .crow .cright{flex-shrink:0}
  /* seletor (lista suspensa) na escolha da visita */
  .startsheet .fld{margin-bottom:13px}
  .startsheet label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px}
  .startsheet select{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:var(--r-sm);
    font-size:15.5px;font-family:inherit;background:var(--card);color:var(--ink)}
  .startsheet select:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
  .startsheet .sinfo{font-size:12px;color:var(--muted);background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:13px;line-height:1.5}

  /* ---- gestão de cliente (Gestão) ---- */
  .cadm .fld{margin-bottom:12px}
  .cadm label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:6px}
  .cadm input[type=text],.cadm input[type=number],.cadm select{width:100%;padding:12px 13px;border:1.5px solid var(--line);
    border-radius:var(--r-sm);font-size:15.5px;font-family:inherit;background:var(--card);color:var(--ink)}
  .cadm input:focus,.cadm select:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
  .cadm .hint2{font-size:11.5px;color:var(--muted);margin-top:5px}
  .cadm .switch{display:flex;align-items:center;gap:9px;text-transform:none;letter-spacing:0;font-size:14px;
    font-weight:600;color:var(--ink);margin:4px 0 2px;cursor:pointer}
  .cadm .switch input{width:18px;height:18px;accent-color:var(--brand)}
  .cadm .cadm-note{font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:var(--r-sm);
    padding:10px 12px;margin:6px 0 12px;line-height:1.5}
  .addbtn{background:var(--brand)!important;color:#fff!important;border-color:var(--brand)!important;font-weight:700}
  .card.tap.inativo{opacity:.62}
  .editado{font-size:10px;font-weight:700;color:var(--brand);background:var(--soft);padding:1px 6px;border-radius:5px;vertical-align:middle}

  /* ===== relatório executivo (formato aprovado) ===== */
  .exwrap{position:fixed;inset:0;background:#fff;z-index:200;overflow:auto;-webkit-overflow-scrolling:touch}
  .exwrap .extools{position:sticky;top:0;display:flex;gap:8px;padding:10px 12px;background:var(--deep);z-index:5}
  .exwrap,.exrep{color-scheme:light}
  .exrep{max-width:800px;margin:0 auto;padding:14px 14px 40px;font-family:var(--sans);color:#12211E;font-size:13px;line-height:1.5;background:#fff}
  .exrep p{margin:0 0 9px}
  .ex-hdr{width:100%;background:#0B3B34;border-collapse:collapse}
  .ex-hdr td{vertical-align:middle;padding:13px 14px}
  .ex-lgcell{width:172px;text-align:center;padding-right:14px!important}
  .ex-lg{background:#fff;border-radius:6px;padding:14px 26px;text-align:center;display:inline-block}
  .ex-lg img{width:118px;display:block;margin:0 auto}
  .ex-kick{color:#9FC6B6;font-size:9px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:2px}
  .ex-t{color:#fff;font-family:var(--disp);font-size:20px;font-weight:700;letter-spacing:-.3px}
  .ex-s{color:#9FC6B6;font-size:10.5px;margin-top:3px}
  .ex-visit{background:#E6F4EB;border:1px solid #DCE4E2;border-top:none;padding:10px 13px;margin-bottom:12px}
  .ex-visit table{width:100%;border-collapse:collapse}
  .ex-visit td{vertical-align:top;font-size:11px;padding:3px 8px 3px 0;width:25%}
  .ex-k{color:#5C6B67;font-size:8.5px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
  .ex-v{font-weight:700;color:#12211E}
  .ex-stamps{margin-top:8px} .ex-stamps td{width:50%;padding-right:8px}
  .ex-stamp{border:1px solid #DCE4E2;background:#fff;border-radius:5px;padding:7px 9px}
  .ex-stamp.in{border-left:3px solid #B45309} .ex-stamp.out{border-left:3px solid #15803D}
  .ex-stamp .lb{font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;color:#5C6B67;font-weight:700}
  .ex-stamp .ts{font-size:15px;font-weight:700;font-family:var(--mono);margin-top:1px}
  .ex-stamp .geo{font-size:9px;color:#5C6B67;font-family:var(--mono);margin-top:2px}
  .ex-perm{font-size:10.5px;color:#5C6B67;margin-top:7px}
  .ex-sec{font-family:var(--disp);font-size:15px;font-weight:700;color:#0B3B34;margin:22px 0 9px;border-bottom:1.5px solid #0B3B34;padding-bottom:5px}
  .ex-sec span{color:#15803D}
  .ex-small{font-size:11px;color:#5C6B67}
  .ex-cards{display:flex;gap:8px;margin-bottom:9px}
  .ex-card{flex:1;border:1px solid #DCE4E2;border-top:2.6px solid #0B3B34;border-radius:6px;padding:13px 6px;text-align:center}
  .ex-num{font-family:var(--disp);font-size:26px;font-weight:700;line-height:1.05}
  .ex-lb{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:#5C6B67;font-weight:700;margin-top:8px}
  .ex-leg span{font-size:10px;font-weight:700;padding:3px 8px;border-radius:4px;margin-right:5px;display:inline-block}
  .ex-leg .c{background:#E6F4EB;color:#15803D} .ex-leg .n{background:#FBEAEA;color:#C62828}
  .ex-leg .a{background:#ECF0F2;color:#546A78} .ex-leg .p{background:#FBF0E2;color:#B45309}
  .ex-risk{display:flex;align-items:center;gap:11px;border:1px solid;border-radius:6px;padding:10px 12px;margin:10px 0 4px}
  .ex-badge{color:#fff;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;border-radius:5px;white-space:nowrap}
  .ex-rtxt{font-size:11px}
  .ex-pi{border:1px solid #DCE4E2;border-radius:7px;margin-bottom:9px;padding:10px 12px}
  .ex-pi.NC{border-color:#F0C4C4;background:#FEFBFB}
  .ex-pitop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .ex-tt{font-weight:700;color:#1F3A5F;font-size:12.5px;line-height:1.3}
  .ex-cat{color:#0B3B34}
  .ex-pillcell{text-align:right;white-space:nowrap}
  .ex-pill{display:inline-block;font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px}
  .ex-pill.NC{background:#FBEAEA;color:#C62828} .ex-pill.C{background:#E6F4EB;color:#15803D}
  .ex-pill.NA,.ex-pill.P{background:#ECF0F2;color:#546A78}
  .ex-prio{font-size:9px;color:#5C6B67;margin-top:3px}
  .ex-meta{font-size:11.5px;margin-top:7px} .ex-meta b{color:#1F3A5F}
  .ex-acao{font-size:11.5px;margin-top:5px} .ex-acao b{color:#1F3A5F} .ex-como{font-weight:700;color:#0B3B34}
  .ex-ok{font-size:11.5px;color:#5C6B67;margin-top:6px}
  .ex-obs{font-size:10.5px;color:#5C6B67;margin-top:5px;font-style:italic}
  .ex-concl{background:#E6F4EB;border-left:3px solid #0B3B34;padding:11px 13px;font-size:11.5px;margin-top:4px}
  .ex-sig{margin-top:4px} .ex-sigimg{max-height:70px;display:block;margin-bottom:4px}
  .ex-signm{font-weight:700} .ex-sigrl{font-size:10.5px;color:#5C6B67}
  .ex-foot{margin-top:16px;border-top:1px solid #DCE4E2;padding-top:8px;font-size:9.5px;color:#5C6B67}

  /* blindagem contra modo escuro forçado do navegador (mantém o relatório claro) */

  .exrep{background-image:linear-gradient(#ffffff,#ffffff)!important}
  .ex-lg{background-image:linear-gradient(#ffffff,#ffffff)!important}
  .ex-visit{background-image:linear-gradient(#E6F4EB,#E6F4EB)!important}
  .ex-stamp{background-image:linear-gradient(#ffffff,#ffffff)!important}

const ROT = {"DDS_EPI_Marcenaria": [{"t": "Abertura", "s": "Contextualize antes de começar", "fala": ["O uso correto dos Equipamentos de Proteção Individual (EPIs) é uma das medidas mais simples e eficazes para prevenir acidentes. Mas de nada adianta ter o EPI disponível se ele não for usado — ou usado da forma errada.", "Hoje vamos revisar os EPIs obrigatórios para as atividades da marcenaria, como usar cada um corretamente e os erros mais comuns que colocam vidas em risco."], "tipo": "fala"}, {"t": "Por que isso importa", "s": "Três razões que não dá para ignorar", "cards": [{"h": "LEI", "x": "A NR-6 exige uso de EPI. A empresa que não fornece e o trabalhador que se recusa injustificadamente podem ser responsabilizados — multa, interdição e processo."}, {"h": "SAÚDE", "x": "A poeira de MDF é cancerígena (IARC). O ruído das serras causa surdez irreversível. Esses danos não aparecem do dia para a noite — e quando aparecem, não têm cura."}, {"h": "FAMÍLIA", "x": "Pense em quem te espera em casa. Um acidente com amputação ou surdez muda a vida da sua família para sempre. O EPI pesa gramas. O acidente pesa para sempre."}], "tipo": "cards"}, {"t": "EPIs obrigatórios na marcenaria", "s": "O que usar, quando e por quê", "cols": ["EPI", "Base legal", "Quando usar e por quê"], "rows": [["Protetor Auditivo", "NR-9/15", "Toda área com máquinas: serras, fresas, lixadeiras, tupias. Dano auditivo é IRREVERSÍVEL."], ["Máscara PFF2", "NR-9/15", "Lixamento, corte de MDF/MDP. A poeira é cancerígena. Máscara cirúrgica NÃO protege."], ["Óculos de Segurança", "NR-6/12", "Serra, tupia, furadeira, plaina, química. Partículas em alta velocidade causam cegueira."], ["Luva de Raspa de Couro", "NR-6", "Manuseio de madeira bruta e arestas. NUNCA use em serras ou máquinas giratórias."], ["Calçado de Segurança", "NR-6", "Obrigatório em todas as áreas durante toda a jornada. Biqueira de aço."], ["Avental de Couro", "NR-6/12", "Tupia, plaina, fresadora — projeção de fragmentos e superfícies cortantes."], ["Máscara Vapores Orgânicos", "NR-9/15", "Pintura, verniz, solvente, cola. Filtro OV específico — verificar validade."]], "tipo": "tabela"}, {"t": "Erros mais comuns", "s": "Não faça isso", "erros": [{"h": "Tirar a máscara para conversar durante o corte", "x": "A poeira já está no ar — o dano começa no momento da exposição."}, {"h": "Usar protetor auditivo só em uma orelha", "x": "O dano auditivo ocorre nos dois ouvidos — não há “lado seguro”."}, {"h": "Usar luva em serras, tupias ou máquinas giratórias", "x": "A luva pode ser puxada e arrastar a mão — risco IMEDIATO de amputação."}, {"h": "Trabalhar com chinelo ou tênis comum na produção", "x": "Um objeto pesado pode esmagar o pé sem proteção em frações de segundo."}, {"h": "Usar óculos de grau no lugar do óculos de segurança", "x": "Óculos de grau não têm certificação de impacto — não protegem."}, {"h": "Guardar máscara usada no bolso ou gaveta aberta", "x": "Contamina a máscara e reduz a eficiência na próxima utilização."}], "tipo": "erros"}, {"t": "Reflexão final", "s": "Para pensar juntos", "refl": "Pense em alguém que te espera em casa hoje. O que aconteceria com essa pessoa se você sofresse um acidente grave aqui? O EPI pesa gramas. O acidente pesa para sempre.", "perg": ["Alguém tem dúvida sobre qual EPI usar em alguma atividade específica?", "Tem algum EPI que incomoda ou que você evita usar? Vamos resolver juntos.", "Você saberia o que fazer se um colega sofresse um acidente agora?"], "tipo": "reflexao"}, {"t": "Encerramento", "s": "Registre o treinamento", "tipo": "fim", "fala": ["Colha a assinatura de todos na lista de presença (página 3 do PDF).", "Assine como responsável técnico e peça a assinatura do responsável da empresa.", "Registre a entrega do material no sistema e anexe foto da lista assinada."]}], "DDS_Calor_Hidratacao_Rural": [{"t": "Abertura", "s": "Contextualize antes de começar", "fala": ["O trabalho no campo sob sol forte é um dos maiores riscos à saúde do trabalhador rural. Calor excessivo, desidratação e exposição prolongada ao sol causam desde cansaço e tontura até insolação grave — que pode ser fatal.", "Hoje vamos falar sobre como o calor afeta o corpo, como se proteger de forma prática e o que fazer em caso de emergência."], "tipo": "fala"}, {"t": "O que o calor faz com o seu corpo?", "s": "Entender o risco é o primeiro passo para se proteger", "intro": "Quando a temperatura do corpo sobe acima do normal, o organismo tenta se resfriar suando. Mas se você não repõe a água perdida e continua exposto ao calor, o corpo começa a falhar:", "fases": [{"h": "Fase 1 — Desidratação leve", "sint": "Boca seca, sede intensa, urina amarela escura, cansaço maior que o normal.", "fazer": "Beber água imediatamente — pelo menos 2 copos (500 ml). Procurar sombra por alguns minutos."}, {"h": "Fase 2 — Exaustão pelo calor", "sint": "Tontura, dor de cabeça forte, náusea, fraqueza, suor excessivo, pele pálida e fria.", "fazer": "PARAR imediatamente. Sentar na sombra. Beber água. Molhar a nuca e os pulsos. Informar o supervisor."}, {"h": "Fase 3 — Insolação (emergência)", "sint": "Pele seca e quente (sem suor), confusão mental, desmaio, temperatura acima de 40 °C.", "fazer": "ACIONAR SOCORRO imediatamente (SAMU 192). Deitar o trabalhador na sombra. Molhar todo o corpo com água fria. NÃO dar líquidos se inconsciente."}], "tipo": "fases"}, {"t": "As 5 regras de ouro contra o calor", "s": "Simples, práticas e que salvam vidas", "regras": [{"n": "1", "h": "Hidrate-se ANTES de sentir sede", "x": "Beba pelo menos 1 copo d’água (200 ml) a cada 20 minutos durante o trabalho. Não espere sentir sede — quando a sede aparece, você já está desidratado. Evite bebidas com cafeína ou álcool durante o trabalho — aumentam a desidratação."}, {"n": "2", "h": "Proteja-se do sol direto", "x": "Use chapéu de aba larga (mínimo 7,5 cm) ou capacete com aba. Aplique protetor solar FPS 30+ antes de sair e reaplique a cada 2 horas. Use camiseta de manga longa com proteção UV quando possível."}, {"n": "3", "h": "Evite as horas mais quentes", "x": "Entre 10h e 16h o sol está no pico — reduza a intensidade do trabalho nesse período. Se possível, adiante tarefas pesadas para o início da manhã ou fim do dia. Use os intervalos para descansar na sombra."}, {"n": "4", "h": "Conheça seus limites", "x": "Se sentir tontura, dor de cabeça ou náusea — PARE e comunique ao supervisor. Não “force” o corpo por pressão de produção — saúde vem primeiro. Trabalhe em dupla quando possível, para que um cuide do outro."}, {"n": "5", "h": "Saiba o que fazer em emergência", "x": "SAMU 192 · Bombeiros 193 · Defesa Civil 199. Tenha sempre um ponto de água fresca acessível na área de trabalho. Informe o supervisor imediatamente em caso de mal-estar de qualquer colega."}], "tipo": "regras"}, {"t": "Quanto devo beber? — guia prático", "s": "A regra simples que todo trabalhador rural deve saber", "hid": [{"k": "A cada 20 min", "v": "1 copo", "u": "~200 ml"}, {"k": "Em 1 hora", "v": "3 copos", "u": "~600 ml"}, {"k": "Em 1 jornada (8h)", "v": "3 litros", "u": "no mínimo — mais se muito calor"}], "dica": "A cor da urina é o melhor indicador de hidratação. <b>Amarelo claro</b> = bem hidratado. <b>Amarelo escuro ou laranja</b> = beba água agora!", "tipo": "hidrata"}, {"t": "Erros mais comuns", "s": "Não faça isso", "erros": [{"h": "Trabalhar sem proteção entre 10h e 16h", "x": "Esse é o horário de maior risco de insolação e queimadura solar."}, {"h": "Esperar a sede aparecer para beber água", "x": "Sede é sinal de desidratação já instalada — previna antes."}, {"h": "Beber refrigerante, café ou álcool no lugar de água", "x": "Essas bebidas aumentam a perda de água — pioram a desidratação."}, {"h": "Ignorar tontura ou dor de cabeça e continuar trabalhando", "x": "São os primeiros sinais de que o corpo está falhando — pare imediatamente."}, {"h": "Trabalhar com roupa escura e sintética no calor", "x": "Absorvem mais calor — prefira roupas claras e de algodão."}, {"h": "Deixar de usar o protetor solar porque “incomoda”", "x": "A exposição acumulada ao sol causa câncer de pele — não tem cura fácil."}], "tipo": "erros"}, {"t": "Reflexão final", "s": "Para pensar juntos", "refl": "Todo ano, trabalhadores rurais morrem por insolação — não por falta de água, mas por não parar a tempo. A pressão da produção não vale uma vida. Cuide-se e cuide do seu colega.", "perg": ["Tem ponto de água acessível na área onde vocês trabalham hoje?", "Alguém já passou mal por causa do calor no trabalho? O que aconteceu?", "Vocês sabem o número do SAMU e onde fica o kit de primeiros socorros?", "O que você faria se visse um colega desmaiar aqui agora?"], "tipo": "reflexao"}, {"t": "Emergência", "s": "Todos precisam saber", "tipo": "emergencia"}, {"t": "Encerramento", "s": "Registre o treinamento", "tipo": "fim", "fala": ["Colha a assinatura de todos na lista de presença (página 3 do PDF).", "Assine como responsável técnico e peça a assinatura do responsável da empresa.", "Registre a entrega do material no sistema e anexe foto da lista assinada."]}], "DDS_Maquinas_NR12_Marcenaria": [{"t": "Abertura", "s": "Contextualize antes de começar", "fala": ["A serra circular é a máquina que mais amputa dedos e mãos no Brasil. Na marcenaria convivemos com serra esquadrejadeira, tupia, plaina e desengrosso — todas capazes de causar uma lesão irreversível em menos de um segundo.", "Hoje vamos falar das proteções dessas máquinas: para que servem, por que nunca devem ser removidas e o que fazer antes de qualquer manutenção."], "tipo": "fala"}, {"t": "Por que isso importa", "s": "Três razões que não dá para ignorar", "cards": [{"h": "LEI", "x": "A NR-12 exige proteção em toda zona de perigo. Operar máquina com proteção removida expõe a empresa a interdição e o responsável a processo — e não existe justificativa de produção que cubra isso."}, {"h": "SAÚDE", "x": "Amputação de dedo ou mão não tem retorno. A serra gira a mais de 3.000 rpm: quando a mão encosta, não há reflexo humano capaz de evitar."}, {"h": "FAMÍLIA", "x": "Um marceneiro sem a mão dominante perde o ofício. Pense em quem depende do seu trabalho antes de tirar aquele coletor “só por um minuto”."}], "tipo": "cards"}, {"t": "Proteções obrigatórias por máquina", "s": "O que precisa estar no lugar antes de ligar", "cols": ["Máquina", "Base legal", "Proteção obrigatória"], "rows": [["Serra circular de bancada", "NR-12", "Coletor de bacia sobre o disco, cutelo divisor (riva) e empurrador. Sem os três, não opere."], ["Esquadrejadeira", "NR-12", "Proteção do disco, cutelo divisor, carro esquadrejador e guia. Nunca serrar “à mão livre”."], ["Tupia", "NR-12", "Proteção da fresa, guia e dispositivo de fixação da peça. Jamais aproximar a mão da fresa."], ["Plaina / desengrosso", "NR-12", "Proteção do eixo porta-facas (tipo ponte) e empurrador. Peça curta exige dispositivo."], ["Lixadeira", "NR-12", "Proteção da correia/disco e sistema de aspiração de pó ativo."], ["Furadeira / respigadeira", "NR-12", "Proteção da broca, fixação da peça — nunca segurar a peça só com a mão."], ["Todas as máquinas", "NR-12", "Parada de emergência acessível, aterramento e chave que impeça religamento automático."]], "tipo": "tabela"}, {"t": "Erros mais comuns", "s": "Não faça isso", "erros": [{"h": "Retirar o coletor de bacia ou o cutelo divisor da serra", "x": "É a causa nº 1 de amputação. O cutelo impede que a peça “agarre” e seja arremessada contra você."}, {"h": "Usar luva ao operar serra, tupia ou lixadeira", "x": "A luva é puxada pela máquina e leva a mão junto. Em máquina giratória: mão nua e longe."}, {"h": "Retirar aparas ou pó com a máquina ligada", "x": "Use um pedaço de madeira ou aspirador — nunca a mão, mesmo com a máquina “quase parando”."}, {"h": "Fazer manutenção sem desligar e bloquear a chave geral", "x": "Alguém pode religar sem ver você. Desligue, bloqueie e sinalize antes de qualquer ajuste."}, {"h": "Serrar peça curta sem empurrador", "x": "Peça pequena aproxima a mão do disco. O empurrador custa nada e vale sua mão."}, {"h": "Continuar operando com proteção quebrada “até o fim do lote”", "x": "Máquina sem proteção é máquina parada. Avise e não opere."}], "tipo": "erros"}, {"t": "Reflexão final", "s": "Para pensar juntos", "refl": "Todo marceneiro que perdeu um dedo achava que sabia o que estava fazendo. A diferença entre um dia normal e uma vida mudada é a proteção que alguém decidiu tirar. O que você faria hoje se a serra não tivesse coletor?", "perg": ["Alguma máquina aqui está operando sem proteção neste momento?", "Todo mundo sabe onde fica a parada de emergência da máquina que opera?", "Vocês têm empurrador disponível em todas as serras?", "Alguém já teve um susto (quase-acidente) com máquina aqui? O que aconteceu?"], "tipo": "reflexao"}, {"t": "Emergência", "s": "Todos precisam saber", "tipo": "emergencia"}, {"t": "Encerramento", "s": "Registre o treinamento", "tipo": "fim", "fala": ["Colha a assinatura de todos na lista de presença (página 3 do PDF).", "Assine como responsável técnico e peça a assinatura do responsável da empresa.", "Registre a entrega do material no sistema e anexe foto da lista assinada."]}], "DDS_Maquinas_NR12_Industria": [{"t": "Abertura", "s": "Contextualize antes de começar", "fala": ["As máquinas produzem — e também são a principal causa de acidentes graves na indústria. Prensas, injetoras, transportadores e esteiras causam amputações e esmagamentos que mudam uma vida em fração de segundo.", "Hoje vamos falar sobre as proteções dessas máquinas, os dispositivos de segurança e o procedimento de bloqueio antes da manutenção."], "tipo": "fala"}, {"t": "Por que isso importa", "s": "Três razões que não dá para ignorar", "cards": [{"h": "LEI", "x": "A NR-12 exige apreciação de risco e proteção em toda zona de perigo. Máquina sem proteção gera interdição imediata pelo fiscal e responsabilização da empresa."}, {"h": "SAÚDE", "x": "Prensa e injetora não avisam. Quando a mão está na zona de prensagem e o ciclo dispara, não existe reação possível — o dano é imediato e permanente."}, {"h": "FAMÍLIA", "x": "O acidente não termina no hospital. Ele reorganiza a vida da sua família para sempre. Nenhuma meta de produção justifica esse risco."}], "tipo": "cards"}, {"t": "Dispositivos de segurança — o que precisa estar funcionando", "s": "Verifique antes de iniciar a operação", "cols": ["Dispositivo", "Base legal", "Função e verificação"], "rows": [["Proteção fixa", "NR-12", "Cobre a zona de perigo e só sai com ferramenta. Nunca opere com proteção removida."], ["Proteção móvel intertravada", "NR-12", "Ao abrir, a máquina precisa parar. Teste: abriu e não parou, a máquina está insegura."], ["Cortina de luz", "NR-12", "Interrompe o ciclo quando algo cruza o feixe. Nunca burlar com fita, papelão ou espelho."], ["Comando bimanual", "NR-12", "Exige as duas mãos fora da zona de perigo. Travar um dos botões é falta grave."], ["Parada de emergência", "NR-12", "Acessível, vermelha em fundo amarelo, sem obstrução. Testar periodicamente."], ["Bloqueio (LOTO)", "NR-12/10", "Desenergizar, bloquear com cadeado e etiquetar antes de qualquer manutenção."], ["Aterramento", "NR-10", "Protege contra choque na carcaça. Verificar em toda máquina elétrica."]], "tipo": "tabela"}, {"t": "Erros mais comuns", "s": "Não faça isso", "erros": [{"h": "Burlar cortina de luz ou intertravamento para ganhar tempo", "x": "É crime de risco e a causa mais comum de amputação em prensa. Nunca, em nenhuma hipótese."}, {"h": "Travar um botão do comando bimanual", "x": "O bimanual existe justamente para manter as duas mãos fora. Travar anula a proteção."}, {"h": "Colocar a mão para desobstruir com a máquina ligada", "x": "Pare, bloqueie e só então intervenha. Máquina “quase parada” ainda mata."}, {"h": "Fazer manutenção sem bloquear a energia (LOTO)", "x": "Alguém pode religar sem saber que você está lá dentro."}, {"h": "Operar máquina sem ter recebido capacitação específica", "x": "Cada máquina tem seu risco. Operar sem treinamento é assumir um risco que não é seu."}, {"h": "Deixar de reportar proteção quebrada", "x": "Máquina sem proteção é máquina parada. Reportar não atrasa a produção — o acidente sim."}], "tipo": "erros"}, {"t": "Reflexão final", "s": "Para pensar juntos", "refl": "Toda proteção de máquina foi instalada depois que alguém, em algum lugar, se machucou. Elas são a memória de acidentes que não precisam se repetir aqui. Qual proteção você foi tentado a burlar esta semana?", "perg": ["Alguma máquina está operando com proteção removida ou burlada agora?", "Todos sabem onde fica a parada de emergência das máquinas que operam?", "O procedimento de bloqueio (LOTO) está sendo usado nas manutenções?", "Alguém já teve um quase-acidente com máquina aqui? O que foi feito depois?"], "tipo": "reflexao"}, {"t": "Emergência", "s": "Todos precisam saber", "tipo": "emergencia"}, {"t": "Encerramento", "s": "Registre o treinamento", "tipo": "fim", "fala": ["Colha a assinatura de todos na lista de presença (página 3 do PDF).", "Assine como responsável técnico e peça a assinatura do responsável da empresa.", "Registre a entrega do material no sistema e anexe foto da lista assinada."]}], "DDS_Maquinas_NR12_Oficina": [{"t": "Abertura", "s": "Contextualize antes de começar", "fala": ["Na oficina, o risco não está só nas máquinas de bancada: o elevador automotivo, o compressor e a esmerilhadeira causam acidentes graves todo ano. Um veículo que cai do elevador ou um disco de corte que estilhaça não dão segunda chance.", "Hoje vamos revisar os equipamentos da oficina, o que precisa ser conferido antes de usar e os erros que mais causam acidentes aqui."], "tipo": "fala"}, {"t": "Por que isso importa", "s": "Três razões que não dá para ignorar", "cards": [{"h": "LEI", "x": "A NR-12 exige proteção e manutenção dos equipamentos; o compressor é vaso de pressão (NR-13) e exige inspeção. Equipamento sem manutenção é responsabilidade da empresa."}, {"h": "SAÚDE", "x": "Um disco de esmeril que estilhaça atinge o rosto em milésimos. Um veículo mal travado no elevador pesa mais de uma tonelada."}, {"h": "FAMÍLIA", "x": "O acidente na oficina raramente é pequeno: é o olho, a mão, o pé. Trabalhe pensando em quem espera você inteiro em casa."}], "tipo": "cards"}, {"t": "Equipamentos da oficina — verificação antes do uso", "s": "O que conferir toda vez", "cols": ["Equipamento", "Base legal", "O que verificar"], "rows": [["Elevador automotivo", "NR-12", "Trava de segurança funcionando, capacidade respeitada, braços bem posicionados no ponto de apoio."], ["Compressor de ar", "NR-13", "Válvula de segurança, manômetro, dreno e inspeção em dia. Nunca usar ar para limpar o corpo."], ["Esmerilhadeira / lixadeira", "NR-12", "Protetor do disco no lugar, disco íntegro e dentro da validade, óculos e protetor facial."], ["Prensa hidráulica", "NR-12", "Proteção contra projeção, dispositivo de fixação, nunca ficar na linha da peça."], ["Macaco e cavalete", "NR-12", "Nunca trabalhar sob veículo apoiado só no macaco — sempre cavalete e calço."], ["Ferramenta pneumática", "NR-12", "Mangueira e engate íntegros, protetor auditivo, nunca apontar para pessoas."], ["Montagem de pneus", "NR-12", "Gaiola de proteção obrigatória ao calibrar — o aro pode ser arremessado."]], "tipo": "tabela"}, {"t": "Erros mais comuns", "s": "Não faça isso", "erros": [{"h": "Trabalhar sob veículo apoiado apenas no macaco hidráulico", "x": "O macaco pode ceder. Sempre use cavalete e calce as rodas — sem exceção."}, {"h": "Usar esmerilhadeira sem o protetor do disco", "x": "O disco pode estilhaçar e atingir rosto e pescoço. O protetor não atrapalha — ele salva."}, {"h": "Calibrar pneu de caminhão fora da gaiola", "x": "O aro se solta com força de explosão. A gaiola existe exatamente para isso."}, {"h": "Usar ar comprimido para limpar roupa ou o corpo", "x": "O ar penetra na pele e pode causar embolia. Nunca brinque com a pistola de ar."}, {"h": "Deixar de conferir a trava do elevador antes de subir o veículo", "x": "O peso não perdoa. Confira a trava e o ponto de apoio toda vez."}, {"h": "Trabalhar com piso encharcado de óleo", "x": "Queda em oficina costuma terminar em fratura ou em contato com equipamento."}], "tipo": "erros"}, {"t": "Reflexão final", "s": "Para pensar juntos", "refl": "Na oficina a gente se acostuma com o risco — e é justamente o costume que machuca. O elevador que sempre funcionou é o mesmo que falha um dia. O que você deixou de conferir hoje por já conhecer o serviço?", "perg": ["Todos os elevadores estão com a trava de segurança funcionando?", "O compressor tem inspeção em dia e válvula de segurança testada?", "Vocês têm gaiola de proteção para calibrar pneus?", "Alguém já teve um susto com equipamento aqui? O que mudou depois?"], "tipo": "reflexao"}, {"t": "Emergência", "s": "Todos precisam saber", "tipo": "emergencia"}, {"t": "Encerramento", "s": "Registre o treinamento", "tipo": "fim", "fala": ["Colha a assinatura de todos na lista de presença (página 3 do PDF).", "Assine como responsável técnico e peça a assinatura do responsável da empresa.", "Registre a entrega do material no sistema e anexe foto da lista assinada."]}]};

const mem={};
const store={
  async get(k){
    try{ if(window.storage){ const r=await window.storage.get(k,false); return r?JSON.parse(r.value):null; } }catch(e){}
    try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){}
    return (k in mem)?mem[k]:null;
  },
  async set(k,val){
    const s=JSON.stringify(val);
    try{ if(window.storage){ await window.storage.set(k,s,false); return true; } }catch(e){}
    try{ localStorage.setItem(k,s); return true; }catch(e){ mem[k]=val; return false; }
  }
};

function parseDate(s){ if(!s)return null; const p=String(s).split('-').map(Number); if(p.length<3)return null; return new Date(p[0],p[1]-1,p[2]); }

}

async function hashPw(pw){
  try{ if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode('brantech::'+pw));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  }}catch(e){}
  let h=5381; for(let i=0;i<pw.length;i++){ h=((h<<5)+h+pw.charCodeAt(i))>>>0; } return 'f'+h.toString(16);
}

function cdata(cid){
  if(!DB.clientData[cid]) DB.clientData[cid]={cnpj:'',cnae:'',grau:'',func:'',endereco:'',
    contato:{nome:'',cargo:'',tel:'',email:''}, docs:{}, obs:''};
  const d=DB.clientData[cid]; d.contato=d.contato||{nome:'',cargo:'',tel:'',email:''}; d.docs=d.docs||{};
  return d;
}
function docStatus(v){
  if(!v) return {k:'na',label:'não informado'};
  const d=daysUntil(v);
  if(d===null) return {k:'na',label:'não informado'};
  if(d<0) return {k:'venc',label:`vencido há ${-d}d`};
  if(d<=60) return {k:'alerta',label:`vence em ${d}d`};
  return {k:'ok',label:'vigente'};
}
function docsResumo(cid){
  const d=cdata(cid).docs||{}; let venc=0,alerta=0,na=0;
  DOCS.forEach(([k])=>{ const s=docStatus(d[k]);
    if(s.k==='venc')venc++; else if(s.k==='alerta')alerta++; else if(s.k==='na')na++; });
  return {venc,alerta,na};
}
function fichaCompleta(cid){
  const d=cdata(cid); let t=0,f=0;
  [d.cnpj,d.cnae,d.grau,d.func,d.endereco,d.contato.nome,d.contato.tel].forEach(x=>{t++; if(x)f++;});
  return Math.round(f/t*100);
}
/* ---- agenda ---- */
function agenda(cid){ return DB.schedule[cid]||{dia:'',obs:''}; }
function agendaStatus(cid){
  const mk=todayKey(), v=visitFor(cid,mk), sch=agenda(cid);
  if(v&&v.checkOut) return {k:'done',label:'Realizada',pill:'done'};
  if(v&&v.checkIn) return {k:'prog',label:'Em andamento',pill:'prog'};
  if(!sch.dia) return {k:'sem',label:'Sem agenda',pill:'ghost'};
  const h=new Date(); const hoje=new Date(h.getFullYear(),h.getMonth(),h.getDate());
  const alvo=new Date(h.getFullYear(),h.getMonth(),Number(sch.dia));
  const dif=Math.round((alvo-hoje)/86400000);
  if(dif<0) return {k:'late',label:`Atrasada ${-dif}d`,pill:'late'};
  if(dif===0) return {k:'hoje',label:'Hoje',pill:'open'};
  return {k:'ag',label:`Dia ${sch.dia}`,pill:'ghost'};
}

  const seg=(SEED.segments[c.segKey]||[]).filter(i=>i.rank<=tr).map((i,x)=>({id:'s'+x,group:c.segKey||'Segmento',...i}));

function getGeo(){
  return new Promise(res=>{
    if(!navigator.geolocation){ res({error:'sem suporte'}); return; }
    let done=false; const to=setTimeout(()=>{if(!done){done=true;res({error:'tempo esgotado'});}},9000);
    navigator.geolocation.getCurrentPosition(
      p=>{ if(done)return; done=true; clearTimeout(to);
        res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}); },
      e=>{ if(done)return; done=true; clearTimeout(to); res({error:e.code===1?'permissão negada':'indisponível'}); },
      {enableHighAccuracy:true,timeout:8000,maximumAge:0});
  });
}
function geoLine(g){
  if(!g) return '';
  if(g.error) return `<span class="geo">GPS: ${esc(g.error)} — capturado no site publicado</span>`;
  return `<span class="geo">${g.lat}, ${g.lng} · ±${g.acc}m &nbsp;<a href="https://maps.google.com/?q=${g.lat},${g.lng}" target="_blank" rel="noopener">ver no mapa</a></span>`;
}
function readFileAsURL(file){
  return new Promise((res,rej)=>{
    if(window.URL && URL.createObjectURL){ try{ res({url:URL.createObjectURL(file),revoke:true}); return; }catch(e){} }
    const fr=new FileReader();
    fr.onload=()=>res({url:fr.result,revoke:false});
    fr.onerror=()=>rej(new Error('falha ao ler o arquivo'));
    fr.readAsDataURL(file);
  });
}
function compressImage(file,maxDim=1000,q=0.55){
  return new Promise(async(res,rej)=>{
    let src; try{ src=await readFileAsURL(file); }catch(e){ rej(e); return; }
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height; const s=Math.min(1,maxDim/Math.max(w,h));
      w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      if(src.revoke) URL.revokeObjectURL(src.url);
      try{ res(c.toDataURL('image/jpeg',q)); }catch(e){ rej(e); }
    };
    img.onerror=()=>{ if(src.revoke) URL.revokeObjectURL(src.url); rej(new Error('arquivo não é uma imagem válida')); };
    img.src=src.url;
  });
}

      row.onclick=()=>openClient(c.id);

async function openVisit(cid,tipo,tier){
  const mk=todayKey(); const c=clientById(cid); const isAudit=(tipo==='nr07');
  let v=visitFor(cid,mk,tipo);
  if(v && isAudit && tier && tier>(v.auditTier||0)){
    const have=new Set(v.checklist.map(x=>x.id));
    buildNR07(tier).forEach(it=>{ if(!have.has(it.id)) v.checklist.push(it); });
    v.auditTier=tier; v.foco='Assessoria NR-07 · '+tierLabelH(tier); await saveVisits();
  }
  if(!v){
    const chk = isAudit ? buildNR07(tier)
      : buildChecklist(c).map(i=>({id:i.id,group:i.group,item:i.item,verify:i.verify,nr:i.nr,
          focus:!!i.focus,rank:i.rank||2,acao:'Regularizar — '+i.verify,prio:null}));
    v={id:'v'+Date.now(),clientId:cid,monthKey:mk,tipo:tipo,auditTier:isAudit?tier:null,
      tech:S.tech==='Gestão'?c.tech:S.tech,
      client:{name:c.name,segment:c.segment,hours:c.hours,tier:c.tier,locality:c.locality,sgg:c.sgg},
      foco: isAudit ? ('Assessoria NR-07 · '+tierLabelH(tier)) : curMonth().foco,
      mes: curMonth().mes, checkIn:null,checkOut:null,
      answers:{},notes:{},photoCount:0,signed:false, checklist:chk};
    DB.visits.push(v); await saveVisits();
  }
  await loadMedia(v.id);
  go('client',{clientId:cid,visit:v,vtab:'ident',panel:null});
}
function stats(v){
  const total=v.checklist.length; let conf=0,nc=0,na=0;
  v.checklist.forEach(it=>{const a=v.answers[it.id]; if(a==='C')conf++; else if(a==='N')nc++; else if(a==='A')na++;});
  const answered=conf+nc+na, pend=total-answered, validos=answered-na;
  const pct=validos?Math.round(conf/validos*100):0, done=total?Math.round(answered/total*100):0;
  return {total,conf,nc,na,pend,answered,validos,pct,done};
}
function idxColor(p){ return p>=90?'var(--ok)':p>=70?'var(--amber)':'var(--no)'; }
function gaugeHTML(s){
  const R=52, C0=2*Math.PI*R, pct=s.validos?s.conf/s.validos:0;
  const col=s.validos?(s.pct>=90?'var(--ok)':s.pct>=70?'var(--amber)':'var(--no)'):'var(--faint)';
  return `<div class="gaugecard">
    <div class="gauge"><svg width="120" height="120" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--line-2)" stroke-width="12"/>
      <circle cx="60" cy="60" r="${R}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round"
        stroke-dasharray="${C0.toFixed(1)}" stroke-dashoffset="${(C0*(1-pct)).toFixed(1)}"
        style="transition:stroke-dashoffset .6s ease,stroke .3s"/></svg>
      <div class="center"><span class="big" style="color:${col}">${s.validos?s.pct:'—'}<span class="u">${s.validos?'%':''}</span></span>
      <span class="cap">Conformidade</span></div></div>
    <div class="gmeta">
      <p><b>${s.conf}</b> conformes</p><p><b>${s.nc}</b> não conformes</p>
      <p><b>${s.na}</b> N/A${s.pend?` · <b>${s.pend}</b> pendentes`:''}</p>
      <div class="prog"><i style="width:${s.done}%"></i></div>
      <p class="gsub">${s.answered} de ${s.total} itens avaliados</p></div>
  </div>`;
}

function hexA(hx,a){ hx=(hx||'#000000').replace('#',''); const n=parseInt(hx,16); return 'rgba('+((n>>16)&255)+','+((n>>8)&255)+','+(n&255)+','+a+')'; }
function nivelRisco(pct, ncAlta){
  if(pct>=90 && !ncAlta) return {t:'Baixo',c:'#2E7D32',sub:'Situação sob controle'};
  if(pct>=70) return {t:'Moderado',c:'#B45309',sub:'Ajustes recomendados'};
  if(pct>=40) return {t:'Elevado',c:'#E65100',sub:'Correção prioritária'};
  return {t:'Crítico',c:'#C62828',sub:'Alerta de exposição jurídico-fiscal'};
}
function execReportNode(v){

function openExecReport(v){

function tabChecklist(w,c,v){

/* ---------- aba PLANO DE AÇÃO (automático a partir das NC) ---------- */
function tabPlano(w,c,v){
  if(!v.checkIn){ w.appendChild(el('div','empty','Inicie a visita para gerar o plano de ação.')); return; }
  const pl=planoItens(v);
  const cA=pl.filter(x=>x.prio==='Alta').length,cM=pl.filter(x=>x.prio==='Média').length,cB=pl.filter(x=>x.prio==='Baixa').length;
  w.appendChild(el('div','kpis',`<div class="kpi r"><div class="n">${cA}</div><div class="l">Alta</div></div>
    <div class="kpi a"><div class="n">${cM}</div><div class="l">Média</div></div>
    <div class="kpi"><div class="n">${cB}</div><div class="l">Baixa</div></div>`));
  if(!pl.length){
    w.appendChild(el('div','empty','Nenhuma não conformidade até agora. O plano de ação é preenchido automaticamente conforme você marca itens como “Não conforme” no checklist.'));
  } else {
    w.appendChild(el('p','sub','Gerado automaticamente das não conformidades. Cada item vira uma ação corretiva priorizada.'));
    pl.forEach(x=>{
      const cls=x.prio==='Alta'?'hi':x.prio==='Média'?'me':'lo';
      const pc=x.prio==='Alta'?'r':x.prio==='Média'?'a':'b';
      w.appendChild(el('div','pl '+cls,`<div class="plh"><span class="plp ${pc}">${x.prio}</span>
        <span class="pln">${esc(x.item)}</span><span class="plnr">${esc(x.nr)}</span></div>
        <div class="pla"><b>Ação recomendada:</b> ${esc(x.acao)}</div>
        ${x.note?`<div class="plo">↳ Obs. do técnico: ${esc(x.note)}</div>`:''}
        ${x.fotos?`<div class="plo">📷 ${x.fotos} foto(s) de evidência</div>`:''}`));
    });
  }
  const b=el('button','btn green','Ir para o relatório ›'); b.style.marginTop='12px';
  b.onclick=()=>go('client',{vtab:'relatorio'}); w.appendChild(b);
}

function ckCard(it){
  const v=S.visit; const cur=v.answers[it.id]||'';
  const ck=el('div','ck'+(cur==='N'?' nc show-note':cur==='C'?' ok':''));
  ck.innerHTML=`<div class="q">${esc(it.item)}</div><div class="v">${esc(it.verify)}</div><div class="nr">${esc(it.nr)}</div>
    <div class="opts">
      <div class="opt c ${cur==='C'?'on':''}" data-a="C">Conforme</div>
      <div class="opt n ${cur==='N'?'on':''}" data-a="N">Não conf.</div>
      <div class="opt a ${cur==='A'?'on':''}" data-a="A">N/A</div>
    </div>
    <textarea placeholder="Observação / o que corrigir…">${esc(v.notes[it.id]||'')}</textarea>
    <div class="photobar">
      <label class="addphoto">📷 Anexar foto<input type="file" accept="image/*" capture="environment" multiple></label>
      <div class="thumbs"></div>
    </div>`;
  $$('.opt',ck).forEach(o=>o.onclick=()=>{
    v.answers[it.id]=o.dataset.a;
    $$('.opt',ck).forEach(x=>x.classList.remove('on')); o.classList.add('on');
    ck.classList.toggle('show-note',o.dataset.a==='N');
    ck.classList.toggle('nc',o.dataset.a==='N'); ck.classList.toggle('ok',o.dataset.a==='C');
    saveVisits(); updateProg();
  });
  $('textarea',ck).oninput=e=>{ v.notes[it.id]=e.target.value; saveVisits(); };
  const thumbs=$('.thumbs',ck);
  const drawThumbs=()=>{
    const arr=S.media.photos[it.id]||[]; thumbs.innerHTML='';
    arr.forEach((src,i)=>{
      const t=el('div','thumb',`<img src="${src}" alt="foto ${i+1}"><button class="x" title="Remover">×</button>`);
      $('img',t).onclick=()=>lightbox(src);
      $('.x',t).onclick=async()=>{ arr.splice(i,1); S.visit.photoCount=countPhotos();
        await saveMedia(); await saveVisits(); drawThumbs(); };
      thumbs.appendChild(t);
    });
  };
  const input=$('input[type=file]',ck);
  input.onchange=async e=>{
    const files=[...e.target.files]; if(!files.length)return;
    const lbl=$('.addphoto',ck); const old=lbl.firstChild.nodeValue;
    lbl.firstChild.nodeValue='Processando…';
    for(const f of files){
      try{ const d=await compressImage(f); (S.media.photos[it.id]=S.media.photos[it.id]||[]).push(d); }
      catch(err){ toast('Não foi possível ler uma das imagens.'); }
    }
    lbl.firstChild.nodeValue=old; S.visit.photoCount=countPhotos();
    await saveMedia(); await saveVisits(); drawThumbs(); input.value='';
  };
  drawThumbs(); return ck;
}
function countPhotos(){ return Object.values(S.media.photos).reduce((a,b)=>a+b.length,0); }
function updateProg(){
  if(!S.visit) return;
  drawGauge();
  const planoBtn=[...document.querySelectorAll('.bni')][2];
  if(planoBtn){ const nc=Object.values(S.visit.answers||{}).filter(a=>a==='N').length;

/* ================= biblioteca de materiais ================= */
function b64ToBlob(b64, type){
  const bin=atob(b64); const len=bin.length; const buf=new Uint8Array(len);
  for(let i=0;i<len;i++) buf[i]=bin.charCodeAt(i);
  return new Blob([buf],{type});
}
function matById(id){ return LIB.find(x=>x.id===id); }
function libFor(seg, mes){
  return LIB.filter(x=>(!seg||x.segmento===seg)&&(!mes||x.mes===mes));
}
function libDoCliente(c){
  const m=curMonth().mes;
  const seg=c.segKey||'';
  const doMes=LIB.filter(x=>x.segmento===seg&&x.mes===m);
  const doSeg=LIB.filter(x=>x.segmento===seg&&x.mes!==m);
  const outros=LIB.filter(x=>x.segmento!==seg);
  return {doMes,doSeg,outros};
}
function abrirPDF(mat){
  try{
    const blob=b64ToBlob(mat.pdf,'application/pdf');
    const url=URL.createObjectURL(blob);
    const w=window.open(url,'_blank');
    if(!w){ const a=document.createElement('a'); a.href=url; a.download=mat.id+'.pdf';
      document.body.appendChild(a); a.click(); a.remove(); }
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){ toast('Não foi possível abrir o PDF.'); }
}
async function compartilharPDF(mat, cid){
  const blob=b64ToBlob(mat.pdf,'application/pdf');
  const nome=mat.id+'.pdf';
  try{
    const file=new File([blob],nome,{type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:mat.titulo, text:`${mat.tipo} — ${mat.tema} (${mat.segmento})`});
      if(cid){ await logMat(cid, mat.tipo, mat.titulo+' — '+mat.segmento, 'Compartilhado (PDF)'); }
      toast('Enviado e registrado no histórico.'); render(); return;
    }
  }catch(err){ if(err&&err.name==='AbortError') return; }
  try{
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=nome;
    document.body.appendChild(a); a.click(); a.remove();
    if(cid){ await logMat(cid, mat.tipo, mat.titulo+' — '+mat.segmento, 'PDF baixado'); }
    toast('PDF baixado e registrado no histórico.'); render();
  }catch(e){ toast('Não foi possível compartilhar o PDF.'); }
}

function initSigPad(canvas,box){
  const ctx=canvas.getContext('2d'); if(!ctx) throw new Error('sem canvas');
  const dpr=window.devicePixelRatio||1; const r=canvas.getBoundingClientRect();
  canvas.width=Math.max(1,r.width*dpr); canvas.height=Math.max(1,r.height*dpr); ctx.scale(dpr,dpr);
  ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#0A0F0C';
  let drawing=false,last=null,dirty=false;
  const pos=e=>{ const b=canvas.getBoundingClientRect(); return {x:e.clientX-b.left,y:e.clientY-b.top}; };
  canvas.addEventListener('pointerdown',e=>{ drawing=true; last=pos(e);
    try{canvas.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
  canvas.addEventListener('pointermove',e=>{ if(!drawing)return; const p=pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p;
    if(!dirty){ dirty=true; box.classList.add('signed'); } e.preventDefault(); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>canvas.addEventListener(ev,()=>drawing=false));
  return { clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); dirty=false; },
           isDirty(){ return dirty; },
           data(){ try{ return dirty?canvas.toDataURL('image/png'):null; }catch(e){ return null; } } };
}

/* ================= gestão / pesquisa ampla ================= */
function matchFilters(c){
  const f=S.f, q=norm(S.q);
  const d=cdata(c.id);
  if(q){
    const hay=norm([c.name,c.sgg,c.locality,c.segment,c.tech,d.cnpj,d.contato.nome].join(' '));
    if(!hay.includes(q)) return false;
  }
  if(f.tech.length && !f.tech.includes(c.tech)) return false;
  if(f.seg.length && !f.seg.includes(c.segment)) return false;
  if(f.tier.length && !f.tier.includes(c.tier||'—')) return false;
  if(f.status.length){ const k=agendaStatus(c.id).k;
    const map={done:'done',prog:'prog',late:'late',hoje:'pend',ag:'pend',sem:'pend'};
    if(!f.status.includes(map[k])) return false; }
  if(f.docs.length){ const r=docsResumo(c.id);
    const ok=(f.docs.includes('venc')&&r.venc>0)||(f.docs.includes('alerta')&&r.alerta>0)||(f.docs.includes('na')&&r.na>0);
    if(!ok) return false; }
  return true;
}

  fw.appendChild(mkRow('Status do mês','status',[['done','Concluída'],['prog','Em andamento'],['late','Atrasada'],['pend','A fazer']],'a'));
  fw.appendChild(mkRow('Documentos','docs',[['venc','Vencidos'],['alerta','Vencendo'],['na','Não informados']],'r'));
  w.appendChild(fw);

  const bar=el('div','row'); bar.style.marginBottom='10px';
  bar.appendChild(el('div','grow mini',`<b>${res.length}</b> resultado(s)`));
  const bl=el('button','chip2','limpar filtros');
  bl.onclick=()=>{ S.q=''; S.f={tech:[],seg:[],tier:[],status:[],docs:[]}; go('admin'); };
  const bx=el('button','chip2','⬇ exportar CSV'); bx.onclick=()=>exportCSV(res);
  const bn=el('button','chip2 addbtn','＋ novo cliente'); bn.onclick=()=>openClientAdmin(null);
  bar.appendChild(bl); bar.appendChild(bx); bar.appendChild(bn); w.appendChild(bar);

  const holder=el('div'); holder.id='admres'; w.appendChild(holder);
  $('#view').appendChild(w);
  drawAdminList(res);
}
function redrawAdmin(){ drawAdminList(allClients(true).filter(matchFilters)); }
function drawAdminList(res){
  const h=$('#admres'); if(!h)return; h.innerHTML='';
  if(!res.length){ h.appendChild(el('div','empty','Nenhum cliente com esses critérios.')); return; }
  const mk=todayKey();
  res.slice(0,60).forEach(c=>{
    const st=agendaStatus(c.id), dr=docsResumo(c.id), v=visitFor(c.id,mk);
    const nc=v?Object.values(v.answers||{}).filter(a=>a==='N').length:0;
    const nm=matsDoMes(c.id,mk).length;
    const card=el('div','card tap'+(c.active===false?' inativo':''),`<div class="row"><div class="grow">
      <div class="name">${esc(c.name)}${c.active===false?' <span class="pill na">inativo</span>':''}${DB.clientEdit[c.id]?' <span class="editado">editado</span>':''}</div>
      <div class="meta"><span><b>${esc(c.tech||'—')}</b></span>
        ${c.segment?`<span class="pill seg">${esc(c.segment)}</span>`:''}
        ${c.tier?`<span class="pill time">${c.tier}</span>`:''}
        ${c.locality?`<span>${esc(c.locality)}</span>`:''}</div>
      <div class="meta">
        ${dr.venc?`<span style="color:var(--red)"><b>${dr.venc} doc vencido</b></span>`:''}
        ${dr.alerta?`<span style="color:var(--amber)"><b>${dr.alerta} vencendo</b></span>`:''}
        ${nc?`<span style="color:var(--red)"><b>${nc} NC</b></span>`:''}
        ${nm?`<span class="phcount">📎 ${nm} material(is)</span>`:''}
        <span class="mini">ficha ${fichaCompleta(c.id)}%</span></div>
    </div><div><span class="pill ${st.pill}">${st.label}</span></div></div>`);
    card.onclick=()=>openClientAdmin(c.id);
    h.appendChild(card);
  });
  if(res.length>60) h.appendChild(el('div','mini','Mostrando os 60 primeiros — refine a busca para ver mais.'));
}
function exportCSV(res){
  const mk=todayKey();
  const head=['Empresa','SGG','Tecnico','Segmento','Cidade','Horas','Nivel','Status do mes','Dia agenda',
    'CNPJ','Grau risco','Funcionarios','Contato','Telefone','Docs vencidos','Docs vencendo','NC do mes','Materiais no mes','Ficha %'];
  const rows=res.map(c=>{
    const d=cdata(c.id), st=agendaStatus(c.id), dr=docsResumo(c.id), v=visitFor(c.id,mk);
    const nc=v?Object.values(v.answers||{}).filter(a=>a==='N').length:0;
    return [c.name,c.sgg,c.tech,c.segment,c.locality,c.hours||'',c.tier||'',st.label,agenda(c.id).dia||'',
      d.cnpj,d.grau,d.func,d.contato.nome,d.contato.tel,dr.venc,dr.alerta,nc,matsDoMes(c.id,mk).length,fichaCompleta(c.id)+'%'];
  });
  const csv=[head,...rows].map(r=>r.map(x=>`"${String(x==null?'':x).replace(/"/g,'""')}"`).join(';')).join('\n');
  try{
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`brantech_gestao_${mk}.csv`; document.body.appendChild(a); a.click(); a.remove();
    toast(`${res.length} clientes exportados.`);
  }catch(e){ toast('Exportação indisponível neste navegador.'); }
}
